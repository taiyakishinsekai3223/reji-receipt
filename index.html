<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>レシート</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#eef1f5;color:#222;padding:20px 14px 40px;text-align:center}
.wrap{max-width:420px;margin:0 auto}
#img{width:100%;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff;display:block}
.hint{font-size:14px;color:#555;margin:14px 0 10px;line-height:1.6}
.btn{display:block;width:100%;height:50px;border:none;border-radius:8px;background:#1a6fd1;color:#fff;font-size:16px;font-weight:bold;font-family:inherit;cursor:pointer}
.err{background:#fff;border-radius:10px;padding:28px 20px;color:#c0392b;font-size:16px;line-height:1.7}
.foot{font-size:12px;color:#888;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div id="out"></div>
</div>
<script>
'use strict';
// ===== お店の情報（ここを書き換えてGitHubに上げなおす） =====
const SHOP = {
  name: 'お店の名前',
  address: '',          // 載せないなら空のまま
  tel: '',              // 載せないなら空のまま
  thanks: 'ありがとうございました',
};
// ================================================================

// レシートの中身はURLの「#」より後ろだけに入っている（GitHubには送られない・どこにも保存されない）
const METHODS = ['現金', 'PayPay', '商品券'];
function b64urlBytes(s){
  const bin = atob(s.replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(bin, c=>c.charCodeAt(0));
}
async function decode(hash){
  const kind = hash[0], bytes = b64urlBytes(hash.slice(1));
  let text;
  if(kind === 'z'){
    if(typeof DecompressionStream === 'undefined') throw new Error('old');
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    text = await new Response(ds).text();
  } else if(kind === 'p') text = new TextDecoder().decode(bytes);
  else throw new Error('bad');
  const a = JSON.parse(text);
  if(!Array.isArray(a) || a[0] !== 2) throw new Error('bad');
  const [, no, sec, items, subDisc, pays, change, giftOver] = a;
  const i = items.map(([name, price, qty, disc]) => [name, price, qty, price*qty - disc, disc]);
  const st = items.reduce((s, x) => s + x[1]*x[2], 0);
  const T = i.reduce((s, x) => s + x[3], 0) - subDisc;
  return { s:SHOP.name, a:SHOP.address, t:SHOP.tel, m:SHOP.thanks, n:no||null, d:sec, i, st, T,
    p: pays.map(([mi, amt, tendered]) => [METHODS[mi] || '', amt, tendered]), c:change, g:giftOver };
}
const yen = n => (n<0?'-':'') + '¥' + Math.abs(n).toLocaleString('ja-JP');
const out = document.getElementById('out');

function draw(r){
  const W = 380, S = 2, PAD = 22;
  const FONT = '-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';
  // 描く行を先に組み立てる
  const ops = [];
  const text = (t, o) => ops.push(Object.assign({k:'t', t:String(t)}, o));
  const lr = (l, r, o) => ops.push(Object.assign({k:'lr', l:String(l), r:String(r)}, o));
  const line = () => ops.push({k:'line'});
  const gap = h => ops.push({k:'gap', h});
  if(r.s) text(r.s, {size:22, bold:true, align:'center'});
  if(r.a) text(r.a, {size:12, align:'center', color:'#555'});
  if(r.t) text('TEL ' + r.t, {size:12, align:'center', color:'#555'});
  gap(6);
  text('レシート', {size:15, bold:true, align:'center'});
  gap(4);
  const d = new Date(r.d*1000), p = n => String(n).padStart(2,'0');
  lr(`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`, r.n ? 'No.' + r.n : '', {size:13, color:'#444'});
  line();
  r.i.forEach(([name, price, qty, amount, disc])=>{
    lr(name, yen(amount + disc), {size:15});
    text(`　${yen(price)} × ${qty}`, {size:12, color:'#666'});
    if(disc) lr('　値引き', '-' + yen(disc), {size:12, color:'#c0392b'});
  });
  line();
  lr('小計', yen(r.st), {size:14});
  const totalDisc = r.st - r.T;
  if(totalDisc) lr('値引き', '-' + yen(totalDisc), {size:14, color:'#c0392b'});
  lr('合計', yen(r.T), {size:24, bold:true});
  gap(4);
  r.p.forEach(([m, amt, tendered])=>{
    if(m === '現金') lr('お預かり（現金）', yen(tendered), {size:14});
    else lr(m, yen(amt), {size:14});
  });
  if(r.c) lr('お釣り', yen(r.c), {size:14});
  if(r.g) lr('商品券の差額（お釣りなし）', yen(r.g), {size:12, color:'#666'});
  line();
  if(r.m) text(r.m, {size:14, align:'center'});

  // 高さを計算して描く
  const lh = o => o.k==='line' ? 18 : o.k==='gap' ? o.h : Math.round((o.size||14) * 1.6);
  const H = PAD*2 + ops.reduce((a,o)=>a+lh(o), 0);
  const c = document.createElement('canvas'); c.width = W*S; c.height = H*S;
  const g = c.getContext('2d'); g.scale(S,S);
  g.fillStyle = '#fff'; g.fillRect(0,0,W,H);
  let y = PAD;
  ops.forEach(o=>{
    const h = lh(o);
    if(o.k==='line'){ g.strokeStyle='#bbb'; g.setLineDash([4,3]); g.beginPath(); g.moveTo(PAD, y+h/2); g.lineTo(W-PAD, y+h/2); g.stroke(); g.setLineDash([]); }
    else if(o.k!=='gap'){
      g.font = `${o.bold?'bold ':''}${o.size||14}px ${FONT}`; g.fillStyle = o.color || '#222'; g.textBaseline = 'middle';
      const cy = y + h/2;
      if(o.k==='t'){ g.textAlign = o.align || 'left'; g.fillText(o.t, o.align==='center' ? W/2 : PAD, cy, W-PAD*2); }
      else { g.textAlign='left'; g.fillText(o.l, PAD, cy, W-PAD*2-110); g.textAlign='right'; g.fillText(o.r, W-PAD, cy); }
    }
    y += h;
  });
  return c;
}

(async function(){
  const hash = location.hash.slice(1);
  let r;
  try{ r = await decode(hash); window.__receipt = r; }
  catch(e){
    out.innerHTML = e.message === 'old'
      ? '<div class="err">お使いのブラウザではレシートを表示できません。<br>ブラウザ（またはiOS）を新しくしてから、もう一度開いてください。</div>'
      : '<div class="err">レシートを読み込めませんでした。<br>お店の画面のQRコードをもう一度読み取ってください。</div>';
    return;
  }
  const canvas = draw(r);
  const url = canvas.toDataURL('image/png');
  const d = new Date(r.d*1000), p = n => String(n).padStart(2,'0');
  const fname = `receipt-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
  out.innerHTML = `<img id="img" alt="レシート" src="${url}">
    <p class="hint">画像を長押しすると「写真に保存」できます</p>
    <button class="btn" id="save">画像を保存する</button>
    <p class="foot">このレシートの内容はお使いの端末の中だけで表示しています。</p>`;
  document.getElementById('save').onclick = async ()=>{
    try{
      const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
      const file = new File([blob], fname, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ /* 共有をやめたとき等は何もしない */ }
  };
})();
</script>
</body>
</html>
